<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Belajar — DigiPath Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .learn-grid{display:grid; grid-template-columns:72% 28%; gap:1.5rem; align-items:start;}
  @media (max-width:980px){ .learn-grid{grid-template-columns:1fr;} }
  .player{aspect-ratio:16/9; background:#0c0d12; border-radius:var(--radius-lg); overflow:hidden; position:relative;}
  .player iframe{width:100%; height:100%; border:0;}
  .player .locked-cover{position:absolute; inset:0; background:rgba(15,16,22,.92); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; text-align:center; padding:2rem;}
  .lesson-item{display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600; cursor:pointer;}
  .lesson-item:hover{background:var(--surface-bg);}
  .lesson-item.active{background:var(--primary-light); border-left:3px solid var(--primary); color:var(--primary);}
  .lesson-item.locked{color:var(--text-muted); cursor:not-allowed; opacity:.65;}
  .lesson-icon{width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:12px;}
  .lesson-icon.done{background:var(--tertiary-emerald); color:#fff;}
  .lesson-icon.current{background:var(--primary); color:#fff;}
  .lesson-icon.locked{background:#eee; color:#aaa;}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div></div>
<div id="notif"></div>

<header class="topbar"><div class="container topbar-inner">
  <div class="brand"><span class="mark">🎓</span>DigiPath <span class="accent">Academy</span></div>
  <div class="nav-links">
    <a href="beranda.html">Katalog Kelas</a>
    <a href="beranda.html#kelas-saya">Kelas Saya</a>
    <a href="ruang-belajar.html" class="active">Ruang Belajar</a>
    <a href="admin.html" id="navAdmin" class="hidden">CRM Admin</a>
  </div>
  <div class="avatar" id="avatarInit">U</div>
</div></header>

<main class="container" style="padding-top:1.5rem; padding-bottom:3rem;">
  <div class="text-sm text-muted mt-1"><a href="beranda.html">Kelas Saya</a> / <span id="crumbCourse">Memuat...</span></div>

  <div class="learn-grid mt-2">
    <div>
      <div class="player" id="playerWrap">
        <div class="locked-cover" id="lockedCover">
          <div style="font-size:32px;">🔒</div>
          <div style="font-weight:700;">Pilih modul di daftar materi</div>
        </div>
      </div>
      <div class="flex justify-between items-center mt-2">
        <div>
          <h1 style="font-size:20px; margin:0;" id="lessonTitle">—</h1>
          <div class="text-sm text-muted" id="lessonSub">—</div>
        </div>
        <button class="btn btn-primary" id="btnSelesai" onclick="tandaiSelesai()">✓ Tandai Selesai &amp; Lanjut</button>
      </div>

      <div class="card mt-3">
        <h3 style="font-size:15px; margin:0 0 .5rem;">📝 Catatan Pribadi Siswa</h3>
        <textarea class="input" id="catatanBox" placeholder="Tuliskan catatan pemahaman Anda untuk modul ini..."></textarea>
        <button class="btn btn-secondary btn-sm mt-1" onclick="simpanCatatan()">Simpan Catatan</button>
      </div>
    </div>

    <aside class="card" style="padding:1rem;">
      <div class="flex justify-between items-center">
        <div style="font-weight:700;">Progres Belajar</div>
        <span class="text-sm" id="progresLabel">0/0</span>
      </div>
      <div class="progress-track mt-1"><div class="progress-fill" id="progresBar" style="width:0%"></div></div>
      <div class="mt-3" style="font-weight:700; font-size:13px;">📋 Daftar Materi Kelas</div>
      <div id="lessonList" class="mt-1"></div>
    </aside>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
requireAuth(['member','admin']);
document.getElementById('avatarInit').textContent = Sesi.me.nama.slice(0,1).toUpperCase();
if (Sesi.me.peran === 'admin') document.getElementById('navAdmin').classList.remove('hidden');

const params = new URLSearchParams(location.search);
const courseId = params.get('courseId');
let currentLessons = [], activeLessonId = params.get('lessonId') || null;

async function muatKelas() {
  if (!courseId) { showNotif('Kelas tidak ditemukan.', 'error'); return; }
  showLoading(true);
  const res = await api('course.detail', { courseId });
  showLoading(false);
  if (!res.success) { showNotif(res.message, 'error'); return; }
  document.getElementById('crumbCourse').textContent = res.data.judul;
  currentLessons = res.data.lessons;
  renderList();
  const selesai = currentLessons.filter(l => l.status === 'selesai').length;
  document.getElementById('progresLabel').textContent = selesai + '/' + currentLessons.length + ' Modul';
  document.getElementById('progresBar').style.width = currentLessons.length ? Math.round(selesai / currentLessons.length * 100) + '%' : '0%';

  if (!activeLessonId) { const terbuka = currentLessons.find(l => l.status !== 'terkunci'); if (terbuka) activeLessonId = terbuka.id; }
  if (activeLessonId) bukaLesson(activeLessonId);
}

function renderList() {
  document.getElementById('lessonList').innerHTML = currentLessons.map(l => {
    const icon = l.status === 'selesai' ? '<span class="lesson-icon done">✓</span>'
      : l.status === 'terkunci' ? '<span class="lesson-icon locked">🔒</span>'
      : '<span class="lesson-icon current">▶</span>';
    return `<div class="lesson-item ${l.id === activeLessonId ? 'active' : ''} ${l.status === 'terkunci' ? 'locked' : ''}" onclick="${l.status !== 'terkunci' ? `bukaLesson('${l.id}')` : ''}">
      ${icon}<span>Modul ${l.urutan}: ${esc(l.judul)}</span>
    </div>`;
  }).join('');
}

async function bukaLesson(id) {
  activeLessonId = id; renderList();
  showLoading(true);
  const res = await api('lesson.get', { lessonId: id });
  showLoading(false);
  if (!res.success) {
    document.getElementById('playerWrap').innerHTML = `<div class="locked-cover"><div style="font-size:32px;">🔒</div><div style="font-weight:700;">${esc(res.message)}</div></div>`;
    return;
  }
  const d = res.data;
  const labelSumber = { youtube: 'Video YouTube', link: 'Dokumen/Link Embed', drive: 'File Google Drive' }[d.sumberKonten] || 'Materi';
  document.getElementById('lessonTitle').textContent = 'Modul: ' + d.judul;
  document.getElementById('lessonSub').textContent = labelSumber;
  document.getElementById('catatanBox').value = d.catatan || '';
  document.getElementById('btnSelesai').disabled = d.selesai;
  document.getElementById('btnSelesai').textContent = d.selesai ? '✓ Modul Sudah Selesai' : '✓ Tandai Selesai & Lanjut';
  document.getElementById('playerWrap').innerHTML = d.fileUrl
    ? `<iframe src="${d.fileUrl}" allow="autoplay" allowfullscreen></iframe>`
    : `<div class="locked-cover"><div style="font-size:32px;">🎬</div><div style="font-weight:700;">Materi belum diunggah admin.</div></div>`;
}

async function tandaiSelesai() {
  const res = await api('lesson.complete', { lessonId: activeLessonId });
  if (!res.success) return showNotif(res.message, 'error');
  showNotif(res.message, 'success');
  await muatKelas(); // segarkan status kunci modul berikutnya
  const berikut = currentLessons.find(l => l.status !== 'terkunci' && l.status !== 'selesai');
  if (berikut) bukaLesson(berikut.id);
}

async function simpanCatatan() {
  const res = await api('lesson.note.save', { lessonId: activeLessonId, catatan: document.getElementById('catatanBox').value });
  showNotif(res.message, res.success ? 'success' : 'error');
}

muatKelas();
</script>
</body>
</html>
